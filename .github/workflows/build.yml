name: Build
on:
  push:
    branches:
      - imda
      - develop
  pull_request:
    branches:
      - imda
      - develop
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: ./actions/checkout@v4
      - name: Setup Node.js
        uses: ./actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Deploy
        run: npm run deploy
